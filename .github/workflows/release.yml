name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - uses: actions/checkout@v7
        with:
          ref: krea2-patch
          path: krea2

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Build binaries
        run: |
          nix build ./main#default --out-link result-main
          nix build ./krea2#default --out-link result-krea2

          mkdir dist
          install -m755 result-main/bin/llama-quantize \
            dist/llama-quantize-city96-x86_64-linux
          install -m755 result-krea2/bin/llama-quantize-krea2 \
            dist/llama-quantize-krea2-x86_64-linux
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
